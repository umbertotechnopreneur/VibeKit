name: ulanzideck / Release
run-name: Release ${{ inputs.tag || 'next version' }} (draft=${{ inputs.draft }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: ulanzideck/v<version>-stable tag; required for the first release
        required: false
        type: string
      draft:
        description: Create a draft for review
        type: boolean
        default: true
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false
      run_tests:
        description: Run hardware-free unit tests when explicitly authorized
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ulanzideck-release-manual-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the initial or next minor release and a new matching tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) { throw 'Package version was not found in Cargo.toml.' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $latestTag = @(gh release list --limit 1000 --json tagName,isDraft,isPrerelease | ConvertFrom-Json | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName.StartsWith('ulanzideck/v') } | Select-Object -First 1 -ExpandProperty tagName)[0]
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the latest published release.' }
          if ([string]::IsNullOrWhiteSpace($latestTag)) {
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
              throw 'No published UlanziDeck release exists in VibeKit. Migrate the previous stable release, or explicitly supply the initial ulanzideck/v<version>-stable tag matching Cargo.toml.'
            }
            Write-Output "Preparing the initial namespaced UlanziDeck release from source version $version."
          } else {
            if ($latestTag -cnotmatch '^ulanzideck/v(?<major>[0-9]+)\.(?<minor>[0-9]+)\.[0-9]+(?:-stable)?$') {
              throw 'The latest published release must use ulanzideck/v<major>.<minor>.<patch>, optionally ending in -stable.'
            }
            $nextVersion = '{0}.{1}.0' -f [int]$Matches.major, ([int]$Matches.minor + 1)
            if ($version -cne $nextVersion) { throw "The next public release must be $nextVersion. Update Cargo.toml and Cargo.lock first." }
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) { $env:RELEASE_TAG = "ulanzideck/v$version-stable" }
          if ($env:RELEASE_TAG -cnotin @("ulanzideck/v$version", "ulanzideck/v$version-stable")) { throw 'Tag must match Cargo.toml, optionally ending in -stable.' }
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          if ($existing) { throw 'This tag already exists. Existing releases are never overwritten.' }
          "tag=$env:RELEASE_TAG" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

    defaults:
      run:
        working-directory: Apps/UlanziDeck
  package:
    needs: prepare
    uses: ./.github/workflows/ci-ulanzideck.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      run_tests: ${{ inputs.run_tests }}
  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create the requested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG -replace '^ulanzideck/', ''
          $stem = "ulanzi-dock-vibeware-$tag"
          $debs = @(Get-ChildItem -LiteralPath dist -Filter '*.deb' -File)
          if ($debs.Count -ne 1) { throw 'Exactly one Linux Debian package is required.' }
          $names = "$stem-windows-x64.zip", "$stem-windows-x64.msi", "$stem-windows-arm64.zip",
            "$stem-windows-arm64.msi", "$stem-linux-x64.tar.gz", $debs[0].Name
          $packages = foreach ($name in $names) { Get-Item -LiteralPath (Join-Path dist $name) }
          $checksums = foreach ($name in $names) { Get-Item -LiteralPath (Join-Path dist "$name.sha256") }
          Push-Location dist
          try {
            Get-Content -LiteralPath $checksums.FullName | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
            & sha256sum --check SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Archive checksum validation failed.' }
          } finally { Pop-Location }
          $cliArgs = @('release', 'create', $env:RELEASE_TAG, '--target', $env:SOURCE_SHA,
            '--title', "UlanziDock VibeWare $env:RELEASE_VERSION", '--generate-notes',
            "--draft=$env:IS_DRAFT", "--prerelease=$env:IS_PRERELEASE")
          $cliArgs += $packages.FullName
          $cliArgs += 'dist/SHA256SUMS.txt'
          gh @cliArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
