name: Widget releases

on:
  push:
    tags:
      - 'openai-usage/v*'
      - 'desktop-ripple/v*'
      - 'retro-terminal/v*'
      - 'vignette/v*'

permissions:
  contents: read

concurrency:
  group: widget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openai-usage:
    if: startsWith(github.ref_name, 'openai-usage/v')
    uses: ./.github/workflows/ci-openai-usage.yml
  desktop-ripple:
    if: startsWith(github.ref_name, 'desktop-ripple/v')
    uses: ./.github/workflows/ci-desktop-ripple.yml
  retro-terminal:
    if: startsWith(github.ref_name, 'retro-terminal/v')
    uses: ./.github/workflows/ci-retro-terminal.yml
  vignette:
    if: startsWith(github.ref_name, 'vignette/v')
    uses: ./.github/workflows/ci-vignette.yml

  release:
    needs: [openai-usage, desktop-ripple, retro-terminal, vignette]
    if: |
      always() && !cancelled() &&
      (needs.openai-usage.result == 'success' ||
       needs.desktop-ripple.result == 'success' ||
       needs.retro-terminal.result == 'success' ||
       needs.vignette.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish the verified Windows and Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ['RELEASE_TAG']
          widget, version = tag.split('/v', 1)
          names = {
              'openai-usage': 'OpenAIUsage',
              'desktop-ripple': 'WaterRipple',
              'retro-terminal': 'RetroTerminal',
              'vignette': 'Vignette',
          }
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Use the MSI product version in the release tag.')
          root = Path('release')
          files = []
          prefix = f'{names[widget]}-{version}-windows-'
          for arch in ('x64', 'arm64'):
              timestamp = r'-\d{8}-\d{6}-\d{3}' if widget == 'openai-usage' else ''
              matches = [p for p in root.glob('*.msi') if re.fullmatch(re.escape(prefix + arch) + timestamp + r'\.msi', p.name)]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {arch} MSI for {version}.')
              files.extend([matches[0], root / f'{prefix}{arch}-portable.zip'])
          debs = list(root.glob('*.deb'))
          if len(debs) != 1:
              raise SystemExit('Expected exactly one Debian package.')
          files.extend(debs)
          if any(not p.is_file() or not p.stat().st_size for p in files):
              raise SystemExit('One or more release packages are missing or empty.')
          checksums = root / 'SHA256SUMS.txt'
          with checksums.open('x') as sums:
              for path in files:
                  with path.open('rb') as stream:
                      sums.write(f'{hashlib.file_digest(stream, "sha256").hexdigest()}  {path.name}\n')
          subprocess.run(
              ['gh', 'release', 'create', tag, *map(str, files), str(checksums),
               '--verify-tag', '--title', f'{names[widget]} {version}',
               '--notes', 'Portable ZIP and per-user MSI for Windows x64 and ARM64, and a Debian package.'],
              check=True,
          )
          PY
