name: helpme / CodeQL

on:
  push:
    branches: [main]
    paths:
      - Apps/HelpMe/**
      - .github/workflows/helpme-codeql.yml
  pull_request:
    branches: [main]
    paths:
      - Apps/HelpMe/**
      - .github/workflows/helpme-codeql.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helpme-codeql-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: Apps/HelpMe/global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build for analysis
        run: dotnet build HelpMe.slnx --configuration Release --warnaserror

      - name: Publish analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
    defaults:
      run:
        working-directory: Apps/HelpMe

  availability:
    name: Report CodeQL availability
    if: ${{ github.event.repository.private && vars.CODE_SECURITY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report unavailable hosted analysis
        run: |
          echo '::warning::CodeQL was not run: enable GitHub Code Security for this private repository, then set CODE_SECURITY_ENABLED=true.'
          echo 'CodeQL analysis is unavailable for this private repository. This job reports availability; it does not certify a security scan. Enable GitHub Code Security and set the repository variable CODE_SECURITY_ENABLED=true to run it.' >> "$GITHUB_STEP_SUMMARY"
