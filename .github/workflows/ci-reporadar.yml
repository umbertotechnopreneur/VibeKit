name: RepoRadar
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verifica e crea i pacchetti
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Apps/RepoRadar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: ./build.ps1 -Channel Portable
      - run: ./artifacts/publish/repo-radar-win-x64/repo-radar.exe --self-test
      - run: ./build.ps1 -Channel Debian
      - name: Prepara e verifica il programma di installazione Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'Checksum WiX errato.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          ./packaging/windows/Build-Msi.ps1 -WixBin $tools
      - uses: actions/upload-artifact@v7
        with:
          name: reporadar-packages
          path: |
            Apps/RepoRadar/artifacts/dist/
            Apps/RepoRadar/artifacts/msi/*.msi
          if-no-files-found: error
          retention-days: 7
