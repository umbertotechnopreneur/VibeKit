name: OpenAI Usage checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Shared calculations and synthetic watchdog checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: Widgets/OpenAI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Widgets/OpenAI/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check shared calculations and isolated persistence
        # These dependency-free checks do not package platform runtime imports.
        run: dotnet run --project Tests/OpenAIUsage.Tests.csproj --configuration Release --artifacts-path "${{ runner.temp }}/openai-usage-checks" -p:RuntimeIdentifiers= -p:NuGetAudit=false
      - name: Check watchdog process ownership with synthetic data
        run: python -B -m unittest discover -s Tests -p 'test_*.py' -v
  gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install native GTK check dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-adw-1 gir1.2-gtk-4.0 xvfb xauth dbus-x11
      - name: Check save, close and error recovery with a synthetic backend
        run: |
          python3 scripts/ci/run_isolated_gtk.py -- /usr/bin/python3 Widgets/OpenAI/Tests/gtk_settings_checks.py
          python3 scripts/ci/run_isolated_gtk.py -- /usr/bin/python3 Widgets/OpenAI/Tests/gtk_settings_checks.py --fail-first
          python3 scripts/ci/run_isolated_gtk.py -- /usr/bin/python3 Widgets/OpenAI/Tests/gtk_settings_recovery_checks.py
  windows-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: windows-latest}
          - {arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Widgets/OpenAI/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - name: Prepare imports and build unsigned MSI
        shell: pwsh
        run: |
          $imports = & ./Widgets/OpenAI/Packaging/Prepare-Packaging.ps1 -WindowsOnly -Architecture $env:PACKAGE_ARCH
          & ./Widgets/OpenAI/Packaging/Build-WindowsDistribution.ps1 -Imports $imports -Architecture $env:PACKAGE_ARCH
      - uses: actions/upload-artifact@v6
        with:
          name: openai-usage-windows-${{ matrix.arch }}
          path: |
            Widgets/OpenAI/artifacts/installers/*.msi
            Widgets/OpenAI/artifacts/installers/*-portable.zip
          if-no-files-found: error
  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Widgets/OpenAI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Widgets/OpenAI/global.json
      - name: Build and inspect Debian package
        run: |
          bash Packaging/Build-Debian.sh "$RUNNER_TEMP/openai-usage-deb"
          dpkg-deb --info "$RUNNER_TEMP"/openai-usage-deb/*.deb
      - uses: actions/upload-artifact@v6
        with:
          name: openai-usage-linux-amd64
          path: ${{ runner.temp }}/openai-usage-deb/*.deb
          if-no-files-found: error
