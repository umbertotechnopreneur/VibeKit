name: Ram Taskman Python checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/Apps/RamTaskman/.uv-cache

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Apps/RamTaskman
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} python -m unittest discover -s tests -v
      # Native calls can stall before the first report. Keep CI bounded and
      # retain Python stacks so a timeout identifies the call being sampled.
      - name: CLI --once
        timeout-minutes: 2
        run: >-
          uv run --locked --python ${{ matrix.python }} python -c
          "import faulthandler, runpy, sys; faulthandler.dump_traceback_later(30, repeat=True); sys.argv = ['ramtaskman', '--once']; runpy.run_module('ramtaskman', run_name='__main__')"
      - name: CLI --json
        timeout-minutes: 2
        run: >-
          uv run --locked --python ${{ matrix.python }} python -c
          "import faulthandler, runpy, sys; faulthandler.dump_traceback_later(30, repeat=True); sys.argv = ['ramtaskman', '--json']; runpy.run_module('ramtaskman', run_name='__main__')"
      - run: uv build
      - run: uv run --locked --python ${{ matrix.python }} python tools/verify_distribution.py
