name: Ram Taskman Python checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/Apps/RamTaskman/.uv-cache

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: Apps/RamTaskman
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uv run --locked --python ${{ matrix.python }} ramtaskman --once
      - run: uv run --locked --python ${{ matrix.python }} ramtaskman --json
      - run: uv build
      - run: uv run --locked --python ${{ matrix.python }} python tools/verify_distribution.py
