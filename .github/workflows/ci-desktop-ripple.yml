name: Desktop Ripple checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check the portable C# pipeline model
        run: dotnet run --project Widgets/WaterRipple/tests/PipelineChecks.csproj --configuration Release --artifacts-path "${{ runner.temp }}/ripple-checks" -p:NuGetAudit=false
      - name: Check JavaScript models
        run: |
          node Widgets/WaterRipple/tests/pipeline-checks.mjs
          node Widgets/WaterRipple/tests/diagnostics-checks.mjs
          node Widgets/WaterRipple/tests/recovery-checks.mjs
          node Widgets/WaterRipple/tests/frame-pacing-checks.mjs
      - name: Install native GTK check dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-adw-1 gir1.2-gtk-4.0 libglib2.0-bin xvfb xauth dbus-x11
      - name: Build Debian package and GNOME extension archive
        run: python3 Widgets/WaterRipple/Linux/build-package.py --output-dir artifacts/desktop-ripple
      - name: Inspect Debian package
        run: dpkg-deb --info artifacts/desktop-ripple/*.deb
      - name: Check real GTK controls and isolated storage
        run: |
          unzip -q artifacts/desktop-ripple/ripple@vibeware.local.shell-extension.zip -d "$RUNNER_TEMP/ripple-extension"
          python3 scripts/ci/run_isolated_gtk.py -- gjs -m Widgets/WaterRipple/tests/gtk-checks.js "$RUNNER_TEMP/ripple-extension"
          python3 scripts/ci/run_isolated_gtk.py -- gjs -m Widgets/WaterRipple/tests/library-checks.js "$RUNNER_TEMP/ripple-extension"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ripple-linux
          path: artifacts/desktop-ripple/*.deb
          if-no-files-found: error
  windows:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Stage WiX 5
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/widget-wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
      - name: Build Release portable ZIP and MSI from source
        shell: pwsh
        run: ./Widgets/WaterRipple/Packaging/Build-MSI.ps1 -Architecture ${{ matrix.architecture }} -WixPath "$env:RUNNER_TEMP/widget-wix/wix.exe" -OutputDirectory "$env:RUNNER_TEMP/ripple-msi"
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-ripple-windows-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/ripple-msi/*.msi
            ${{ runner.temp }}/ripple-msi/*.zip
          if-no-files-found: error
