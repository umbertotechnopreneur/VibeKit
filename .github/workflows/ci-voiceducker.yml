name: voiceducker / Portable ZIPs and MSI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runtime: win-x64
          - architecture: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Apps/VoiceDucker/global.json
      - name: Check settings, window placement, single-instance behavior and audio restoration
        if: matrix.architecture == 'x64'
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./scripts/test-settings-persistence.ps1
          ./scripts/test-window-placement.ps1
          ./scripts/test-single-instance.ps1
          ./scripts/test-playback-restoration.ps1
      - name: Clean and build portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -Configuration Release
      - name: Create portable ZIP with documentation and license
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceDucker-${{ matrix.runtime }}
          path: |
            Apps/VoiceDucker/artifacts/VoiceDucker-${{ matrix.runtime }}.zip
            Apps/VoiceDucker/artifacts/VoiceDucker-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error

    defaults:
      run:
        working-directory: Apps/VoiceDucker
  build:
    needs: portable
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Windows builds and regression checks
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          if [ "$PORTABLE_RESULT" != "success" ]; then
            echo "Windows builds or regression checks did not succeed: $PORTABLE_RESULT"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: VoiceDucker-win-*
          path: artifacts/portable
          merge-multiple: true
      - name: Verify ZIP contents and checksums
        run: |
          cd artifacts/portable
          sha256sum --check VoiceDucker-win-x64.zip.sha256
          sha256sum --check VoiceDucker-win-arm64.zip.sha256
          unzip -t VoiceDucker-win-x64.zip
          unzip -t VoiceDucker-win-arm64.zip
          for archive in VoiceDucker-win-*.zip; do
            unzip -Z1 "$archive" | grep -Fx VoiceDucker.exe
            unzip -Z1 "$archive" | grep -Fx LICENSE
          done

  windows-msi:
    name: Framework-dependent Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Apps/VoiceDucker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Apps/VoiceDucker/global.json
      - name: Stage WiX 5
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/wix5" wix --version 5.0.2
      - name: Build x64 app
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture x64 -Configuration Release
      - name: Package MSI
        shell: pwsh
        run: ./scripts/package-msi.ps1 -WixPath "$env:RUNNER_TEMP/wix5/wix.exe" -OutputDirectory "$env:RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: voiceducker-windows-msi-x64
          path: ${{ runner.temp }}/VoiceDucker-windows-x64.msi
          if-no-files-found: error
