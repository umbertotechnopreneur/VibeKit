name: VibeKit CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.markdown'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/docs/**/*.png'
      - '**/docs/**/*.jpg'
      - '**/docs/**/*.jpeg'
      - '**/docs/**/*.webp'
      - '**/docs/**/*.svg'
      - '**/docs/**/*.pdf'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.markdown'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/docs/**/*.png'
      - '**/docs/**/*.jpg'
      - '**/docs/**/*.jpeg'
      - '**/docs/**/*.webp'
      - '**/docs/**/*.svg'
      - '**/docs/**/*.pdf'
  workflow_dispatch:
    inputs:
      project:
        description: Project to check
        type: choice
        default: all
        options:
          - all
          - helpme
          - markvibe
          - thermalright
          - ulanzideck
          - voiceducker
          - worktrail
          - ghostty-shaders
          - openai-usage
          - desktop-ripple
          - retro-terminal
          - studio-controls
          - reporadar
          - vignette

permissions:
  contents: read

concurrency:
  group: vibekit-ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.project || 'changed' }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    name: Select changed projects
    runs-on: ubuntu-24.04
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify change selection
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Verifica il comando di pubblicazione
        run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Cerca una verifica già riuscita nella PR di dev
        if: github.event_name == 'push'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: python3 scripts/ci/reuse_pr.py
      - name: Compare the complete push or pull request
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SELECTED_PROJECT: ${{ inputs.project || 'all' }}
          REUSED_RUN: ${{ steps.previous.outputs.run }}
        run: |
          if [[ -n "$REUSED_RUN" ]]; then
            echo 'projects=[]' >> "$GITHUB_OUTPUT"
            echo "Verifiche già superate nel run $REUSED_RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/ci/select_projects.py
          fi

  helpme:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'helpme')
    uses: ./.github/workflows/ci-helpme.yml
  markvibe:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'markvibe')
    uses: ./.github/workflows/ci-markvibe.yml
  thermalright:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'thermalright')
    uses: ./.github/workflows/ci-thermalright.yml
  ulanzideck:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'ulanzideck')
    uses: ./.github/workflows/ci-ulanzideck.yml
  voiceducker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'voiceducker')
    uses: ./.github/workflows/ci-voiceducker.yml
  worktrail:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'worktrail')
    uses: ./.github/workflows/ci-worktrail.yml
  worktrail-scripts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'worktrail')
    uses: ./.github/workflows/ci-worktrail-scripts.yml
  ghostty-shaders:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'ghostty-shaders')
    uses: ./.github/workflows/ci-ghostty-shaders.yml
  desktop-ripple:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'desktop-ripple')
    uses: ./.github/workflows/ci-desktop-ripple.yml
  openai-usage:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'openai-usage')
    uses: ./.github/workflows/ci-openai-usage.yml
  retro-terminal:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'retro-terminal')
    uses: ./.github/workflows/ci-retro-terminal.yml

  studio-controls:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'studio-controls')
    uses: ./.github/workflows/ci-studio-controls.yml

  reporadar:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'reporadar')
    uses: ./.github/workflows/ci-reporadar.yml

  vignette:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'vignette')
    uses: ./.github/workflows/ci-vignette.yml

  required:
    name: VibeKit CI required
    if: always()
    needs: [changes, helpme, markvibe, thermalright, ulanzideck, voiceducker, worktrail, worktrail-scripts, ghostty-shaders, desktop-ripple, openai-usage, retro-terminal, studio-controls, reporadar, vignette]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected pipeline to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('Project selection failed or was cancelled.')
          selected = json.loads(results['changes']['outputs']['projects'])
          required = set(selected)
          if 'worktrail' in required:
              required.add('worktrail-scripts')
          failed = [name for name in required if results[name]['result'] != 'success']
          if failed:
              raise SystemExit('Required pipelines failed or were cancelled: ' + ', '.join(sorted(failed)))
          print('Every selected pipeline succeeded; unrelated projects were skipped.')
          PY
      - name: "Verificato PR ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.sha }} ${{ needs.changes.outputs.tree }}"
        if: github.event_name == 'pull_request'
        run: echo "Tutti i progetti selezionati hanno superato i controlli."
