name: helpme / Dependency review

on:
  pull_request:
    branches: [main]
    paths:
      - Apps/HelpMe/**
      - .github/workflows/helpme-dependency-review.yml
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.markdown'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**/*.png'
      - '!**/docs/**/*.jpg'
      - '!**/docs/**/*.jpeg'
      - '!**/docs/**/*.webp'
      - '!**/docs/**/*.svg'
      - '!**/docs/**/*.pdf'

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
    defaults:
      run:
        working-directory: Apps/HelpMe

  nuget-audit:
    name: Audit NuGet dependencies
    if: ${{ github.event.repository.private && vars.CODE_SECURITY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Apps/HelpMe/global.json
      - name: Restore and reject high or critical vulnerabilities
        working-directory: Apps/HelpMe
        run: dotnet restore HelpMe.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -p:WarningsAsErrors="NU1900%3BNU1903%3BNU1904%3BNU1905"
      - name: Explain security coverage
        run: |
          echo 'NuGet audit checked direct and transitive packages for high/critical vulnerabilities. GitHub Dependency Review is unavailable on this private repository; license and dependency-diff review were not performed.' >> "$GITHUB_STEP_SUMMARY"
